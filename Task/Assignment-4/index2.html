<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento</title>
    <link rel="stylesheet" href="style2.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>
<body>
    <main>
        <!-- HEADER SECTION -->
        <header class="component">
            <div id="head1" class="head">
                <h1>Deep°style</h1>
            </div>
            <div id="head2" class="head">
                <p>New Arrivals</p>
                <p>Shop</p>
                <p>Beauty</p>
                <p>Sale</p>
                <p>Journal</p>
            </div>
            <div id="head3" class="head">
                <i class="ri-search-line"></i>
                <i class="ri-remix-line"></i>
                <i class="ri-shopping-cart-2-line" style="background-color: black; color: white;"></i>
            </div>
        </header>
        <!-- HERO SECTION -->
        <section class="component" id="heroSection">
            <!-- ABOSLUTE IMAGES & DIVS -->
            <div id="abstext">
                <p>Summer Collection</p>
                <h3 style="font-weight: 400;font-size:1.7vw;">TRANDY AND<br> CLUSSI FOR<br>NEW SEASSON</h3>
            </div>
            <div class="absImg img1">
                <img src="images/absimg.png" alt="">
            </div>
            <div class="absImg img2">
                <img src="images/absimg2.png" alt="">
            </div>
            <div class="absImg img3">
                <img src="images/absimg3.png" alt="">
            </div>
            <div class="absImg img5">
                <img src="images/absimg6.png" alt="">
            </div>
            <div class="absImg img6">
                <img src="images/absimg7.png" alt="">
            </div>
            <div class="abstext img4">
                <img src="images/abstext1.png" alt="">
            </div>
            <div class="abstext2">
                <p style="font-size: 20px;">#2022</p>
            </div>

            <!-- MAIN HERO -->
            <div id="heroNav">
                <h1>Make Your Fashion Look<br>More Charming</h1>
            </div>
            <div id="innerHero">
                <div id="leftcenter" class="gridDiv"></div>
                <div id="secdiv">
                    <div id="secuppr" class="gridDiv">
                        <!-- <img src="https://i.pinimg.com/1200x/cd/79/05/cd7905153a52c6d4db6027959f295bfa.jpg" alt="2"> -->
                    </div>
                    <div id="secbtm" class="gridDiv"></div>
                </div>
                <div id="center" class="gridDiv"></div>
                <div id="frdiv">
                    <div id="fruppr" class="gridDiv"></div>
                    <div id="frbtm" class="gridDiv"></div>
                </div>
                <div id="rightcenter" class="gridDiv"></div>
            </div>
        </section>
    </main>
</body>
</html>
